<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZIMA 360 · Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #163f78 0%, transparent 38%),
        radial-gradient(circle at bottom right, #f5a900 0%, transparent 32%),
        linear-gradient(135deg, #061426, #0b2341 55%, #07111f);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 26px;
      padding: 38px 34px 32px;
      box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.15);
      color: #10213b;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #0b3975, #f2a900);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 12px;
    }

    .logo {
      width: 210px;
      max-width: 80%;
      height: auto;
      object-fit: contain;
      display: inline-block;
    }

    .system-title {
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      color: #0b3975;
      margin-top: 4px;
    }

    .system-subtitle {
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: #7b8491;
      margin-top: 5px;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 19px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #243650;
    }

    .input-box {
      position: relative;
    }

    .input-box input {
      width: 100%;
      height: 52px;
      border: 1px solid #d7dce4;
      border-radius: 13px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      transition: .2s;
      background: #f9fafc;
      color: #16263d;
    }

    .input-box input:focus {
      border-color: #0b4a92;
      box-shadow: 0 0 0 4px rgba(11,74,146,.10);
      background: #fff;
    }

    .password-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      color: #687789;
    }

    .login-button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0b3975, #1258a0);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
      box-shadow: 0 10px 22px rgba(11,57,117,.22);
      margin-top: 5px;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 27px rgba(11,57,117,.30);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .status.error {
      display: block;
      background: #fff0f0;
      color: #a92727;
      border: 1px solid #f1caca;
    }

    .status.success {
      display: block;
      background: #effaf3;
      color: #19703a;
      border: 1px solid #c7ead2;
    }

    .connection {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      color: #8b95a3;
    }

    .connection-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #20a15a;
      margin-right: 5px;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: rgba(255,255,255,.65);
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px 27px;
        border-radius: 22px;
      }

      .logo {
        width: 185px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="login-card">

      <!-- LOGO -->
      <div class="logo-container">
        <img
          src="img/logo.png"
          alt="ZIMA 360"
          class="logo"
          onerror="this.style.display='none';"
        >
      </div>

      <div class="system-title">
        Sistema de Centro de Efectivo
      </div>

      <div class="system-subtitle">
        SFT · EFICIENCIA · CONTROL · CONFIANZA
      </div>

      <!-- LOGIN -->
      <form id="loginForm">

        <div class="field">
          <label for="usuario">
            Usuario
          </label>

          <div class="input-box">
            <input
              type="text"
              id="usuario"
              name="usuario"
              autocomplete="username"
              placeholder="Ingrese su usuario"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="password">
            Contraseña
          </label>

          <div class="input-box">

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Ingrese su contraseña"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              title="Mostrar contraseña"
            >
              👁
            </button>

          </div>
        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          INGRESAR AL SISTEMA
        </button>

      </form>

      <div
        id="status"
        class="status"
      ></div>

      <div class="connection">
        <span class="connection-dot"></span>
        Sistema conectado en línea
      </div>

    </div>

    <div class="footer">
      ZIMA 360 · Sistema de Gestión
    </div>

  </div>


<script>

/* ============================================================
   CONFIGURACIÓN DEL BACKEND
   ============================================================ */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzcTUFKBSpOF5G1Nh3-B9yEkRkihYIik3npJDLXloSgIxbAJ5PYhnW1fvoQYySBEyaY7Q/exec";

try {
  localStorage.setItem("ZIMA_API_URL", API_URL);
} catch (e) {}


/* ============================================================
   ELEMENTOS
   ============================================================ */

const loginForm =
  document.getElementById("loginForm");

const usuarioInput =
  document.getElementById("usuario");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const statusBox =
  document.getElementById("status");

const togglePassword =
  document.getElementById("togglePassword");


/* ============================================================
   MOSTRAR / OCULTAR CONTRASEÑA
   ============================================================ */

togglePassword.addEventListener("click", function () {

  if (passwordInput.type === "password") {

    passwordInput.type = "text";
    togglePassword.textContent = "🙈";

  } else {

    passwordInput.type = "password";
    togglePassword.textContent = "👁";

  }

});


/* ============================================================
   MENSAJES
   ============================================================ */

function mostrarMensaje(mensaje, tipo) {

  statusBox.className =
    "status " + tipo;

  statusBox.textContent =
    mensaje;

}


function limpiarMensaje() {

  statusBox.className =
    "status";

  statusBox.textContent =
    "";

}


/* ============================================================
   GUARDAR SESIÓN
   ============================================================ */

function guardarSesion(datos) {

  const token =
    datos.token ||
    datos.sessionToken ||
    datos.sesion ||
    "";

  const usuarioSesion = {

    usuario:
      datos.usuario || "",

    nombre:
      datos.nombre || "",

    rol:
      datos.rol || "",

    peaje:
      datos.peaje || "",

    estado:
      datos.estado || "ACTIVO",

    token:
      token,

    sessionToken:
      token,

    loginAt:
      new Date().toISOString()

  };

  localStorage.setItem(
    "ZIMA_USUARIO",
    JSON.stringify(usuarioSesion)
  );

  localStorage.setItem(
    "ZIMA_SESION",
    JSON.stringify(usuarioSesion)
  );

  localStorage.setItem(
    "ZIMA360_SESION",
    JSON.stringify(usuarioSesion)
  );

  localStorage.setItem(
    "ZIMA_SESSION",
    JSON.stringify(usuarioSesion)
  );

  localStorage.setItem("ZIMA_SESION_ESTADO", "ACTIVA");
  localStorage.setItem("ZIMA360_USUARIO", usuarioSesion.usuario);
  localStorage.setItem("ZIMA360_NOMBRE", usuarioSesion.nombre);
  localStorage.setItem("ZIMA360_ROL", usuarioSesion.rol);
  localStorage.setItem("ZIMA360_PEAJE", usuarioSesion.peaje);
  localStorage.setItem("ZIMA_USER_NAME", usuarioSesion.nombre);
  localStorage.setItem("ZIMA_PEAJE", usuarioSesion.peaje);

  if (token) {
    localStorage.setItem("ZIMA_SESSION_TOKEN", token);
    localStorage.setItem("ZIMA360_SESSION_TOKEN", token);
    localStorage.setItem("ZIMA_TOKEN", token);
    sessionStorage.setItem("ZIMA_SESSION_TOKEN", token);
  }

}


function loginJsonp(usuario, password) {

  return new Promise(function(resolve, reject) {

    const callback =
      "__zima_login_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script =
      document.createElement("script");

    const query =
      new URLSearchParams({
        action: "login",
        usuario: usuario,
        password: password,
        callback: callback
      });

    const timer =
      setTimeout(function() {
        cleanup();
        reject(new Error("Tiempo agotado al conectar con ZIMA 360."));
      }, 20000);

    function cleanup() {
      clearTimeout(timer);
      try {
        delete window[callback];
      } catch (e) {
        window[callback] = undefined;
      }
      script.remove();
    }

    window[callback] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("No fue posible acceder al Web App de ZIMA 360."));
    };

    script.src =
      API_URL + "?" + query.toString();

    document.head.appendChild(script);

  });
}


async function autenticarRemoto(usuario, password) {

  try {

    const respuesta =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "login",

            usuario: usuario,

            password: password

          }),

          redirect: "follow"
        }
      );

    const texto =
      await respuesta.text();

    return JSON.parse(texto);

  } catch (error) {

    return loginJsonp(
      usuario,
      password
    );
  }
}


/* ============================================================
   LOGIN
   ============================================================ */

loginForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    limpiarMensaje();

    const usuario =
      usuarioInput.value.trim();

    const password =
      passwordInput.value;

    if (!usuario) {

      mostrarMensaje(
        "Ingrese el usuario.",
        "error"
      );

      usuarioInput.focus();

      return;
    }

    if (!password) {

      mostrarMensaje(
        "Ingrese la contraseña.",
        "error"
      );

      passwordInput.focus();

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "VALIDANDO...";


    try {

      const resultado =
        await autenticarRemoto(
          usuario,
          password
        );

      /*
      const respuesta =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "login",

              usuario: usuario,

              password: password

            }),

            redirect: "follow"
          }
        );


      const texto =
        await respuesta.text();

      let resultado;


      try {

        resultado =
          JSON.parse(texto);

      } catch (e) {

        console.error(
          "Respuesta del servidor:",
          texto
        );

        throw new Error(
          "El servidor no devolvió una respuesta válida."
        );

      }
      */


      if (
        resultado &&
        resultado.ok === true
      ) {

        guardarSesion(
          resultado
        );


        mostrarMensaje(
          "Acceso correcto. Bienvenido " +
          (resultado.nombre || resultado.usuario) +
          ".",
          "success"
        );


        loginButton.textContent =
          "ACCESO CORRECTO";


        setTimeout(
          function () {

            window.location.href =
              "dashboard.html";

          },
          700
        );


        return;
      }


      mostrarMensaje(
        resultado.mensaje ||
        resultado.error ||
        "Usuario o contraseña incorrectos.",
        "error"
      );


    } catch (error) {

      console.error(
        "Error de conexión:",
        error
      );


      mostrarMensaje(
        "No fue posible conectar con ZIMA 360. " +
        "Verifique que este login esté siendo abierto desde el sistema.",
        "error"
      );

    } finally {

      loginButton.disabled = false;

      if (
        loginButton.textContent !==
        "ACCESO CORRECTO"
      ) {

        loginButton.textContent =
          "INGRESAR AL SISTEMA";
      }

    }

  }
);


/* ============================================================
   ENTER / FOCO
   ============================================================ */

window.addEventListener(
  "load",
  function () {

    usuarioInput.focus();

  }
);


/* ============================================================
   SI YA EXISTE SESIÓN
   ============================================================ */

(function comprobarSesion() {

  try {

    const activa =
      localStorage.getItem(
        "ZIMA_SESION"
      );

    const usuario =
      localStorage.getItem(
        "ZIMA_USUARIO"
      );

    if (
      activa === "ACTIVA" &&
      usuario
    ) {

      // No redirigimos automáticamente
      // para evitar bloquear el login.

    }

  } catch (e) {

    console.warn(
      "No se pudo consultar la sesión local."
    );

  }

})();

</script>

</body>
</html>
